name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build -w @freedomstream/contracts
      - run: docker compose config --quiet
      - run: docker compose --env-file .env -f deploy/production/compose.yaml config --quiet
        env:
          APP_IMAGE: freedomstream/app:0000000000000000000000000000000000000000
          LIVEKIT_USAGE_IMAGE: freedomstream/livekit-usage:1.13.11
          STATE_DIR: /tmp/freedomstream-production-config-check
          PUBLIC_URL: https://stream.example:8443
      - run: docker compose up --build -d --wait
      - run: npm run smoke -- --restart-app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: docker compose down
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-windows-
      - uses: actions/cache@v4
        with:
          path: .local/downloads
          key: native-installer-${{ runner.os }}-${{ hashFiles('deploy/native-runtime.json') }}
      - run: node --test scripts/native-tools.test.mjs
      - run: npm run native:setup
      - run: npm run native:check
      - run: npm run native:test
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/native.ps1 build
      - run: npm run native:package
      - name: Qualify bundled portable application
        shell: powershell
        run: |
          $release = Get-Content .local/distribution/publisher.json -Raw | ConvertFrom-Json
          & scripts/qualify-portable.ps1 -Executable (Join-Path .local/distribution $release.filename)
      - uses: actions/upload-artifact@v4
        with:
          name: freedomstream-windows-x64
          path: |
            .local/distribution/*.exe
            .local/distribution/publisher.json
          retention-days: 14
