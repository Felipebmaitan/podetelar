[package]
name = "freedomstream-installed"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# Independent bootstrap: building an installer must not resolve the media SDK again.
[workspace]

[dependencies]
velopack = "=1.2.161"

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
strip = "debuginfo"
