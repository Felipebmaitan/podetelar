[workspace]
members = ["apps/publisher", "apps/portable"]
resolver = "3"
exclude = [".local/native-sdk/livekit", ".local/native-sdk/webrtc-sys", ".local/native-sdk/libwebrtc"]

[patch.crates-io]
libwebrtc = { path = ".local/native-sdk/libwebrtc" }
livekit = { path = ".local/native-sdk/livekit" }
webrtc-sys = { path = ".local/native-sdk/webrtc-sys" }

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
