name: Deploy VPS
on:
  workflow_run:
    workflows: [Checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: freedomstream-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Select a checked main commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [[ "$EVENT" == workflow_dispatch ]]; then
            CHECKED_SHA=$latest
            success=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" | jq --arg sha "$CHECKED_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | length')
            [[ "$success" -gt 0 ]] || { echo 'Current main has no successful Checks run'; exit 1; }
          fi
          if [[ "$CHECKED_SHA" != "$latest" ]]; then
            echo 'Skipping superseded main commit'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CHECKED_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - name: Send committed source to the restricted deploy command
        if: steps.target.outputs.skip != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.VPS_HOST }}
          DEPLOY_USER: ${{ vars.VPS_USER }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          git archive --format=tar "$DEPLOY_SHA" | gzip -n | \
            ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              -i "$key" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
